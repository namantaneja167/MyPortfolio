<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Illustrative ETRM migration flow</title>
  <desc id="description">A conceptual transition from CXL through incremental data processing to Endur reporting.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#21162a"/>
      <stop offset="1" stop-color="#0b080c"/>
    </linearGradient>
    <linearGradient id="signal" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="1030" y2="0">
      <stop stop-color="#7652a8"/>
      <stop offset="1" stop-color="#d8c0ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1020" cy="110" r="220" fill="#9d62dc" opacity=".1"/>
  <path d="M92 530H1100" stroke="#6e567f" stroke-width="2" opacity=".6"/>
  <path d="M170 386H1030" stroke="url(#signal)" stroke-width="5"/>
  <path d="m1010 366 25 20-25 20" fill="none" stroke="#d8c0ff" stroke-width="5"/>
  <g fill="#21162a" stroke="#c2a4ff" stroke-width="2">
    <rect x="125" y="270" width="220" height="230" rx="4"/>
    <rect x="490" y="230" width="220" height="300" rx="4"/>
    <rect x="855" y="270" width="220" height="230" rx="4"/>
  </g>
  <g fill="#eae5ec" font-family="Geist,Arial,sans-serif">
    <text x="155" y="320" font-size="18" letter-spacing="3" opacity=".6">SOURCE</text>
    <text x="155" y="390" font-size="42" font-weight="600">CXL</text>
    <text x="520" y="286" font-size="18" letter-spacing="3" opacity=".6">TRANSFORM</text>
    <text x="520" y="365" font-size="38" font-weight="600">dbt</text>
    <text x="520" y="412" font-size="17" opacity=".7">incremental models</text>
    <text x="885" y="320" font-size="18" letter-spacing="3" opacity=".6">REPORTING</text>
    <text x="885" y="390" font-size="42" font-weight="600">Endur</text>
    <text x="92" y="612" font-size="17" letter-spacing="4" fill="#c2a4ff">ILLUSTRATIVE DATA FLOW · NOT A CLIENT ARCHITECTURE</text>
  </g>
  <g fill="#c2a4ff">
    <circle cx="367" cy="386" r="7"/>
    <circle cx="425" cy="386" r="5" opacity=".6"/>
    <circle cx="793" cy="386" r="7"/>
    <circle cx="735" cy="386" r="5" opacity=".6"/>
  </g>
</svg>
