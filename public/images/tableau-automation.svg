<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Illustrative Tableau automation workflow</title>
  <desc id="description">A conceptual Python automation sequence for extracts, dashboard comparisons, and sheet visibility.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#24192d"/>
      <stop offset="1" stop-color="#0b080c"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="358" y1="0" x2="842" y2="0">
      <stop stop-color="#8056ad"/>
      <stop offset="1" stop-color="#d8c0ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="260" cy="500" r="220" fill="#9d62dc" opacity=".08"/>
  <g fill="#eae5ec" font-family="Geist,Arial,sans-serif">
    <text x="88" y="106" font-size="17" letter-spacing="4" fill="#c2a4ff">ILLUSTRATIVE AUTOMATION FLOW</text>
    <text x="88" y="167" font-size="22" opacity=".7">Reporting tasks</text>
    <text x="475" y="167" font-size="22" opacity=".7">Python framework</text>
    <text x="880" y="167" font-size="22" opacity=".7">Repeatable outputs</text>
  </g>
  <g fill="#21162a" stroke="#bfa1e6" stroke-width="2">
    <rect x="88" y="220" width="270" height="88" rx="4"/>
    <rect x="88" y="336" width="270" height="88" rx="4"/>
    <rect x="88" y="452" width="270" height="88" rx="4"/>
    <rect x="465" y="248" width="270" height="264" rx="4"/>
    <rect x="842" y="220" width="270" height="88" rx="4"/>
    <rect x="842" y="336" width="270" height="88" rx="4"/>
    <rect x="842" y="452" width="270" height="88" rx="4"/>
  </g>
  <g fill="#eae5ec" font-family="Geist,Arial,sans-serif" font-size="18">
    <text x="120" y="274">Extract downloads</text>
    <text x="120" y="390">Dashboard comparisons</text>
    <text x="120" y="506">Sheet visibility</text>
    <text x="505" y="327" font-size="26" font-weight="600">Python</text>
    <text x="505" y="374" opacity=".7">Tableau REST API</text>
    <text x="505" y="408" opacity=".7">XML + configuration</text>
    <text x="505" y="463" fill="#c2a4ff">60% less manual effort</text>
    <text x="875" y="274">Scheduled extracts</text>
    <text x="875" y="390">Consistent comparisons</text>
    <text x="875" y="506">Configured workbooks</text>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="3">
    <path d="M358 264h107"/>
    <path d="M358 380h107"/>
    <path d="M358 496h107"/>
    <path d="M735 264h107"/>
    <path d="M735 380h107"/>
    <path d="M735 496h107"/>
  </g>
  <text x="88" y="636" fill="#b9a8c5" font-family="Geist,Arial,sans-serif" font-size="16">Conceptual illustration; no client workbook or dashboard shown.</text>
</svg>
