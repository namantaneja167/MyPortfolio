<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Illustrative MLOps workflow</title>
  <desc id="description">A conceptual workflow for reusable Databricks code, MLflow tracking, and versioned model outputs.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#24192d"/>
      <stop offset="1" stop-color="#0b080c"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="358" y1="0" x2="842" y2="0">
      <stop stop-color="#8056ad"/>
      <stop offset="1" stop-color="#d8c0ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="260" cy="500" r="220" fill="#9d62dc" opacity=".08"/>
  <g fill="#eae5ec" font-family="Geist,Arial,sans-serif">
    <text x="88" y="106" font-size="17" letter-spacing="4" fill="#c2a4ff">ILLUSTRATIVE MLOPS WORKFLOW</text>
    <text x="88" y="167" font-size="22" opacity=".7">Notebook work</text>
    <text x="475" y="167" font-size="22" opacity=".7">Reusable code + tracking</text>
    <text x="880" y="167" font-size="22" opacity=".7">Versioned outputs</text>
  </g>
  <g fill="#21162a" stroke="#bfa1e6" stroke-width="2">
    <rect x="88" y="220" width="270" height="88" rx="4"/>
    <rect x="88" y="336" width="270" height="88" rx="4"/>
    <rect x="88" y="452" width="270" height="88" rx="4"/>
    <rect x="465" y="248" width="270" height="264" rx="4"/>
    <rect x="842" y="220" width="270" height="88" rx="4"/>
    <rect x="842" y="336" width="270" height="88" rx="4"/>
    <rect x="842" y="452" width="270" height="88" rx="4"/>
  </g>
  <g fill="#eae5ec" font-family="Geist,Arial,sans-serif" font-size="18">
    <text x="120" y="274">Large notebooks</text>
    <text x="120" y="390">Repeated functions</text>
    <text x="120" y="506">Model outputs</text>
    <text x="505" y="327" font-size="26" font-weight="600">Databricks</text>
    <text x="505" y="374" opacity=".7">Reusable Python modules</text>
    <text x="505" y="408" opacity=".7">MLflow runs + metrics</text>
    <text x="505" y="463" fill="#c2a4ff">Registration + versioning</text>
    <text x="875" y="274">Tracked runs</text>
    <text x="875" y="390">Registered models</text>
    <text x="875" y="506">Timestamped outputs</text>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="3">
    <path d="M358 264h107"/>
    <path d="M358 380h107"/>
    <path d="M358 496h107"/>
    <path d="M735 264h107"/>
    <path d="M735 380h107"/>
    <path d="M735 496h107"/>
  </g>
  <text x="88" y="636" fill="#b9a8c5" font-family="Geist,Arial,sans-serif" font-size="16">Conceptual illustration; no client or model data shown.</text>
</svg>
